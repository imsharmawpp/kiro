<script>
document.addEventListener('DOMContentLoaded', () => {
  gsap.registerPlugin(ScrollTrigger);
  const $ = (s,c=document) => c.querySelector(s);
  const $$ = (s,c=document) => Array.from(c.querySelectorAll(s));

  // ── LOADER ──
  setTimeout(() => {
    const l = $('#loader');
    l.style.transition='opacity .9s ease'; l.style.opacity='0';
    setTimeout(() => l.remove(), 900);
  }, 2600);

  // ── CURSOR ──
  const cur=$('#cursor'),ring=$('#cursorRing');
  let mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px';});
  (function tick(){rx+=(mx-rx)*.13;ry+=(my-ry)*.13;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(tick);})();
  $$('a,button,.am-card,.brand-cell,.tag,.pr-card').forEach(el=>{
    el.addEventListener('mouseenter',()=>{cur.style.transform='translate(-50%,-50%) scale(2.2)';ring.style.transform='translate(-50%,-50%) scale(1.6)';ring.style.opacity='.9';});
    el.addEventListener('mouseleave',()=>{cur.style.transform='translate(-50%,-50%) scale(1)';ring.style.transform='translate(-50%,-50%) scale(1)';ring.style.opacity='.55';});
  });

  // ── HERO CANVAS ──
  const cv=$('#hero-canvas'),ctx=cv.getContext('2d');
  function resize(){cv.width=innerWidth;cv.height=innerHeight;}
  resize();window.addEventListener('resize',resize);
  class P{constructor(){this.reset()}reset(){this.x=Math.random()*cv.width;this.y=cv.height+20;this.vx=(Math.random()-.5)*.4;this.vy=-(Math.random()*.6+.15);this.r=Math.random()*1.4+.3;this.op=Math.random()*.5+.1;this.life=0;this.max=Math.random()*280+120}step(){this.x+=this.vx;this.y+=this.vy;this.life++;if(this.life>this.max||this.y<-10)this.reset()}draw(){const fi=Math.min(this.life/40,1),fo=Math.min((this.max-this.life)/40,1);ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(201,168,76,${this.op*fi*fo})`;ctx.fill()}}
  const pts=Array.from({length:130},()=>new P());
  let archT=0;
  function drawArch(){archT+=.005;const pulse=.04+Math.sin(archT)*.015,cx=cv.width/2,cy=cv.height*.72,sc=Math.min(cv.width/900,1.3);ctx.save();ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.strokeStyle=`rgba(201,168,76,${pulse})`;ctx.lineWidth=1.5;ctx.strokeRect(-260,-220,64,220);ctx.strokeRect(196,-220,64,220);ctx.beginPath();ctx.moveTo(-196,0);ctx.lineTo(-196,-150);ctx.bezierCurveTo(-196,-280,196,-280,196,-150);ctx.lineTo(196,0);ctx.stroke();ctx.beginPath();ctx.arc(0,-290,18,0,Math.PI*2);ctx.stroke();ctx.restore();}
  function heroLoop(){ctx.clearRect(0,0,cv.width,cv.height);const g=ctx.createRadialGradient(cv.width/2,cv.height*.6,0,cv.width/2,cv.height*.6,cv.height*.6);g.addColorStop(0,'rgba(201,168,76,.045)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);drawArch();pts.forEach(p=>{p.step();p.draw()});requestAnimationFrame(heroLoop);}
  heroLoop();

  // ── HERO PARALLAX ──
  window.addEventListener('scroll',()=>{
    const el=$('.hero-content');if(!el||scrollY>innerHeight)return;
    el.style.transform=`translateY(${scrollY*.28}px)`;
    el.style.opacity=Math.max(0,1-scrollY/(innerHeight*.75));
  });

  // ── NAV SCROLL ──
  window.addEventListener('scroll',()=>{$('#navbar').classList.toggle('scrolled',scrollY>70);});

  // ── REVEAL ON SCROLL ──
  const ro=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');ro.unobserve(e.target);}});},{threshold:.08,rootMargin:'0px 0px -40px 0px'});
  $$('.rv').forEach(el=>ro.observe(el));

  // ── GATEWAY ARCH DRAW ──
  ScrollTrigger.create({
    trigger:'#gateway-arch',start:'top 80%',once:true,
    onEnter:()=>{
      gsap.to($$('.arch-draw'),{strokeDashoffset:0,duration:1.4,stagger:.08,ease:'power2.out'});
      gsap.to($$('.arch-fill'),{opacity:1,duration:.5,delay:.9,stagger:.1});
    }
  });

  // ── GATEWAY STATS COUNTER ──
  ScrollTrigger.create({
    trigger:'.gw-stats',start:'top 85%',once:true,
    onEnter:()=>{
      $$('.gw-stat .n[data-target]').forEach(el=>{
        const t=parseFloat(el.dataset.target),dec=parseInt(el.dataset.decimals||0),suf=el.dataset.suffix||'';
        gsap.to({v:0},{v:t,duration:2,ease:'power2.out',onUpdate:function(){el.textContent=this.targets()[0].v.toFixed(dec)+suf;}});
      });
    }
  });
});
</script>
